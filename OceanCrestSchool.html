<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Ocean Crest School – Excellence · Character · Future</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --ocean:#006994;--deep:#004d70;--sky:#0099cc;--teal:#00b5a0;
  --sand:#f4e4c1;--dark:#0d1b2a;--grey:#f0f4f8;--text:#1a2535;--muted:#5a6a7a;
  --shadow:0 20px 60px rgba(0,105,148,.18);--r:14px;
}
html{scroll-behavior:smooth;}
body{font-family:'Inter',sans-serif;color:var(--text);background:#fff;overflow-x:hidden;}
img{display:block;width:100%;object-fit:cover;}
a{text-decoration:none;color:inherit;}
.container{max-width:1200px;margin:0 auto;padding:0 28px;}
.badge{display:inline-block;background:rgba(0,181,160,.13);color:var(--teal);
  font-size:.73rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  padding:6px 16px;border-radius:30px;margin-bottom:14px;}
.section-title{font-family:'Playfair Display',serif;font-size:clamp(1.9rem,3.5vw,2.9rem);
  font-weight:900;color:var(--dark);line-height:1.15;margin-bottom:12px;}
.section-sub{color:var(--muted);font-size:.97rem;line-height:1.75;
  margin-bottom:48px;max-width:560px;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;
  border-radius:50px;font-size:.92rem;font-weight:700;cursor:pointer;
  border:none;transition:all .3s;text-decoration:none;}
.btn-primary{background:linear-gradient(135deg,var(--ocean),var(--teal));color:#fff;
  box-shadow:0 8px 28px rgba(0,105,148,.35);}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(0,105,148,.45);}
.btn-outline{background:transparent;color:var(--ocean);border:2px solid var(--ocean);}
.btn-outline:hover{background:var(--ocean);color:#fff;transform:translateY(-3px);}
.btn-white{background:#fff;color:var(--ocean);}
.btn-white:hover{background:var(--sand);transform:translateY(-3px);}
.btn-ghost{background:rgba(255,255,255,.15);backdrop-filter:blur(8px);
  color:#fff;border:1px solid rgba(255,255,255,.3);}
.btn-ghost:hover{background:rgba(255,255,255,.25);transform:translateY(-3px);}
</style>
</head>
<body>
<!-- Content injected by subsequent appends -->
</body>
</html>
